function lines(text,maxWidth,font){ctx.font=font;let result=[],line='';for(const word of text.trim().split(/\s+/).filter(Boolean)){let test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){result.push(line);line=word}else line=test}if(line)result.push(line);return result}
function write(text,x,y,maxWidth,maxLines,size,lineHeight){if(!text)return;ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#3d4680';ctx.direction='rtl';let font='bold '+size+'px Tahoma,Arial,sans-serif';let rows=lines(text,maxWidth,font);while(rows.length>maxLines&&size>26){size-=3;font='bold '+size+'px Tahoma,Arial,sans-serif';rows=lines(text,maxWidth,font)}ctx.font=font;rows.slice(0,maxLines).forEach((row,i)=>ctx.fillText(row,x,y+i*lineHeight,maxWidth))}
function draw(){if(!img.complete||!img.naturalWidth)return;ctx.drawImage(img,0,0,1172,1980);write(nameEl.value,974,757,700,2,47,56);write(seasonEl.value,974,970,700,2,43,55);write(bioEl.value,974,1245,765,5,39,60)}
img.onload=draw;[nameEl,seasonEl,bioEl].forEach(el=>el.addEventListener('input',draw));document.getElementById('show').onclick=()=>{if(!nameEl.value.trim()||!seasonEl.value.trim()||!bioEl.value.trim()){document.getElementById('error').textContent='عبّي الخانات الثلاث أولًا';return}document.getElementById('error').textContent='';draw();document.getElementById('preview').scrollIntoView({behavior:'smooth',block:'start'})};
